<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地笔记与待办</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">记</span>
          <span class="brand-text">本地笔记</span>
        </div>
        <nav class="primary-nav">
          <button class="nav-item" type="button" data-view="notes">笔记</button>
          <button class="nav-item" type="button" data-view="todos">待办</button>
          <button class="nav-item" type="button" data-view="mine">我的</button>
        </nav>
      </aside>
      <main class="main-area">
        <header class="page-header">
          <h1 id="page-title">笔记</h1>
          <div id="page-actions" class="page-actions"></div>
        </header>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <div id="confirm-root" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">确认操作</h2>
        <p id="confirm-detail"></p>
        <div class="modal-actions">
          <button class="button" type="button" data-action="close-confirm">取消</button>
          <button class="button danger" type="button" id="confirm-action">删除</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
