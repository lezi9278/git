<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>乐乐笔记</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app-root" class="app-root">
      <header id="topbar" class="topbar">
        <div class="title-block">
          <h1 id="page-title">笔记</h1>
          <p id="page-subtitle"></p>
          <div id="category-popover" class="category-popover" hidden></div>
          <div id="search-bar" class="search-bar" hidden></div>
        </div>
        <div id="page-actions" class="top-actions"></div>
      </header>

      <main id="content" class="content"></main>

      <button id="fab" class="fab" type="button" hidden></button>

      <nav id="bottom-tabs" class="bottom-tabs" aria-label="主导航"></nav>
    </div>

    <div id="confirm-root" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">确认操作</h2>
        <p id="confirm-detail"></p>
        <div class="modal-actions">
          <button class="button" type="button" data-action="close-confirm">取消</button>
          <button class="button danger" type="button" id="confirm-action">删除</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
